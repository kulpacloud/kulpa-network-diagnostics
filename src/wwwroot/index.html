<!DOCTYPE html>
<html>
    <head>
        <title>Kulpa Network Diagnostics</title>
        <link rel="stylesheet" href="./main.css" />
    </head>
    <body class="m-9 bg-slate-200">
        <h1 class="text-4xl">Kulpa Network Diagnostics</h1>
        <table class="table-auto mt-6 rounded-md border border-slate-800 border-collapse">
            <thead>
                <tr class="text-center text-xl text-slate-800">
                    <th scope="col" class="border border-slate-800">Service</th>
                    <th scope="col" class="border border-slate-800">Host</th>
                    <th scope="col" class="border border-slate-800">Result</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>

        <h2 class="text-4xl">Browser Capabilities</h2>
        <table class="table-auto mt-6 rounded-md border border-slate-800 border-collapse">
            <thead>
                <tr class="text-center text-xl text-slate-800">
                    <th scope="col" class="border border-slate-800">Feature</th>
                    <th scope="col" class="border border-slate-800">Result</th>
                </tr>
            </thead>
            <tbody>
                <tr class="p-2 border border-slate-800">
                    <td class="p-2 border border-slate-800">Javascript</td>
                    <td id="javascript-result" class="p-2 border border-slate-800">
                        <noscript>
                            &#x274C
                        </noscript>
                    </td>
                </tr>
            <tr class="p-2 border border-slate-800">
                <td class="p-2 border border-slate-800">WebAssembly</td>
                <td id="wasm-result" class="p-2 border border-slate-800"></td>
            </tr>
            <tr class="p-2 border border-slate-800">
                <td class="p-2 border border-slate-800">WebSocket</td>
                <td id="websocket-result" class="p-2 border border-slate-800"></td>
            </tr>
            </tbody>
        </table>
        <script src="ping.js"></script>
        <script src="browser.js"></script>
    <script>
        document.onreadystatechange = function () {
            testJavascript();
            testWebAssembly();
            testWebSockets();
        }
    </script>
    </body>
</html>
